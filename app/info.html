zh:{pluginTitle:"电脑端插件安装",pluginMarket:"先安装并打开 DeepSeek Harness Desktop，在插件市场搜索 dsh-pet-holocubic，安装并启用。",pluginRestart:"完成后重启 DSH Desktop，并保持它运行。电脑和设备需在同一局域网。",pluginVerify:"电脑浏览器访问 http://127.0.0.1:17890/state；能看到状态 JSON 即表示插件服务已启动。",pluginLink:"在设备配置页填电脑的局域网 IP（不是 127.0.0.1）、端口 17890、事件路径 /events，保存并重连。若被防火墙阻挡，仅对可信局域网放行 TCP 17890。",pluginManualTitle:"市场不可用？手动安装",pluginManual:"安装 Node.js 20 或更高版本及 pnpm 后，在实际使用的 DSH profile 目录执行以下命令（默认目录如下）：",pluginBundle:"在该 profile 的 package.json 中，向 dsh.profile.bundles 数组追加字符串 \"dsh-pet-holocubic\"，保留已有条目，再重启 DSH。",pluginWarning:"市场安装和手动安装二选一；不要再手动添加同一插件的 cordis.patch.yml 条目，以免重复加载。若 17890 被占用，先解决端口冲突或将设备端口设为插件实际监听的端口。",title:"HoloPet · 蓝毛女仆精简版",alt:"HoloPet 应用图标",aria:"切换为英文",intro:"把 DeepSeek Harness 工作状态变成桌面角色动画。",features:"114 个标准速度动作，保留终端页小动画、走动镜像、字体与音效。",controls:"左右倾斜或方向键切换两页。设备 HOME 短按退出；已连接手柄 SELECT / HOME 退出，需 hidpad 服务。",connect:"通过设备配置页设置 DSH 主机、动作、音效和配色；实时联动需要电脑运行 DSH 插件。",install:"将 app/ 内容复制到 /sd/apps/dsh_fish/ 后重新扫描。支持其他应用 ID。升级时需替换旧资源，单纯覆盖不会清除冗余文件。",meta:"版本：1.5.1 · 安装文件约 27.11 MiB（未压缩）",license:"代码：GPL-3.0 · 蓝毛女仆素材：CC BY-NC-SA 4.0，仅限非商业使用。",author:"作者：chicochol"},
